name: ResolveAI Continuous Integration (CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend CI Job ───────────────────────────────────────────────────────────
  backend-ci:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: resolveai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 ruff

      - name: Run Code Linting & Style Checks
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Execute Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/resolveai_test
          SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
          ALGORITHM: HS256
          ENVIRONMENT: testing
          DEBUG: false
        run: |
          pytest -v --durations=10

  # ── Frontend CI Job ──────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Strict Typecheck
        run: npx tsc --noEmit

      - name: Execute Vitest Component Tests
        run: npm run test

      - name: Build Production Assets
        run: npm run build
