version: '3.8'

services:
  # ── PostgreSQL with pgvector ───────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resolveai_db
    environment:
      POSTGRES_DB: resolveai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resolveai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - resolveai_net

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resolveai_backend
    environment:
      - PROJECT_NAME=ResolveAI
      - ENVIRONMENT=production
      - DEBUG=false
      - API_V1_STR=/api/v1
      - SECRET_KEY=production-secret-key-change-in-prod
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/resolveai
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=INFO
      - LOG_JSON_FORMAT=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - resolveai_net

  # ── React / Nginx Frontend ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resolveai_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - resolveai_net

volumes:
  pgdata:
    driver: local

networks:
  resolveai_net:
    driver: bridge